<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structures Ressources — Outils Pédagogiques & Accompagnement</title>
<style>
  :root {
    --sante:      #e91e8c;
    --sciences:   #2979ff;
    --enviro:     #00c853;
    --citoyen:    #ff6d00;
    --culture:    #aa00ff;
    --numerique:  #00b0ff;
    --intercult:  #ff9100;
    --affectif:   #f50057;
    --sport:      #00bfa5;
    --parentalite:#76b82a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d0d1a;
    color: #f0f0f8;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HERO ── */
  .hero {
    position: relative;
    text-align: center;
    padding: 80px 24px 60px;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 55% at 20% 30%, #e91e8c33 0%, transparent 70%),
      radial-gradient(ellipse 50% 45% at 80% 20%, #2979ff33 0%, transparent 70%),
      radial-gradient(ellipse 55% 60% at 50% 90%, #aa00ff33 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-tag {
    display: inline-block;
    font-size: .7rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #aaa;
    border: 1px solid #333;
    border-radius: 100px;
    padding: 4px 14px;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(1.6rem, 4vw, 3rem);
    font-weight: 800;
    line-height: 1.15;
    max-width: 800px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, #fff 30%, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-sub {
    color: #888;
    font-size: .95rem;
    margin-bottom: 40px;
  }
  .hero-stats {
    display: flex;
    gap: 32px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .stat {
    text-align: center;
  }
  .stat-num {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, #fff, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-label { font-size: .75rem; color: #666; text-transform: uppercase; letter-spacing: .1em; }

  /* ── SEARCH & FILTERS ── */
  .controls {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,13,26,.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid #1e1e3a;
    padding: 14px 24px;
  }
  .search-wrap {
    max-width: 480px;
    margin: 0 auto 14px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #666;
  }
  #search {
    width: 100%;
    padding: 10px 14px 10px 40px;
    background: #16162c;
    border: 1px solid #2a2a50;
    border-radius: 100px;
    color: #f0f0f8;
    font-size: .9rem;
    outline: none;
    transition: border-color .2s;
  }
  #search:focus { border-color: #c084fc; }
  #search::placeholder { color: #555; }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .filter-btn {
    cursor: pointer;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .05em;
    padding: 5px 14px;
    border-radius: 100px;
    border: 1.5px solid transparent;
    background: #16162c;
    color: #aaa;
    transition: all .2s;
    white-space: nowrap;
  }
  .filter-btn:hover { color: #fff; }
  .filter-btn.active {
    color: #fff;
    background: var(--c);
    border-color: var(--c);
    box-shadow: 0 0 12px var(--c);
  }

  /* ── GRID ── */
  .grid-wrap { padding: 32px 20px 60px; max-width: 1400px; margin: 0 auto; }
  .grid {
    columns: 3 320px;
    column-gap: 18px;
  }

  /* ── CARD ── */
  .card {
    break-inside: avoid;
    margin-bottom: 18px;
    border-radius: 16px;
    background: #13132a;
    border: 1px solid #1e1e3a;
    overflow: hidden;
    transition: transform .25s, box-shadow .25s, opacity .3s;
    cursor: default;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(0,0,0,.5), 0 0 0 1px var(--c);
  }
  .card.hidden { display: none; }

  .card-accent {
    height: 4px;
    background: linear-gradient(90deg, var(--c), transparent);
  }
  .card-body { padding: 18px 20px 20px; }

  .card-section {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: .65rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--c);
    margin-bottom: 10px;
  }
  .card-section::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--c);
    flex-shrink: 0;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .card-title.no-name {
    font-style: italic;
    color: #aaa;
  }

  .card-desc {
    font-size: .82rem;
    color: #9090b0;
    line-height: 1.65;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card.expanded .card-desc { -webkit-line-clamp: unset; }

  .card-toggle {
    margin-top: 8px;
    font-size: .72rem;
    color: var(--c);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
  }
  .card-toggle:hover { text-decoration: underline; }

  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    font-size: .75rem;
    font-weight: 600;
    color: var(--c);
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid var(--c);
    transition: background .2s, color .2s;
  }
  .card-link:hover {
    background: var(--c);
    color: #fff;
  }

  /* ── NO RESULTS ── */
  #no-results {
    display: none;
    text-align: center;
    padding: 80px 24px;
    color: #555;
    font-size: 1.1rem;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 24px;
    font-size: .75rem;
    color: #444;
    border-top: 1px solid #1e1e3a;
  }

  /* ── FLOATING BLOBS ── */
  .blobs {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .07;
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translateY(0)   rotate(0deg); }
    50%  { transform: translateY(-40px) rotate(180deg); }
    100% { transform: translateY(0)   rotate(360deg); }
  }
  .hero, .controls, .grid-wrap, footer { position: relative; z-index: 1; }
</style>
</head>

  {k:"parentalite", title:"EnJeux — Pôle universitaire enfance-jeunesse", desc:"Pôle de recherche en SHS et santé dans le domaine de l'enfance-jeunesse porté par les universités ligériennes. Thématiques : agentivité, bien-être à l'école, parentalités, filiations.", url:"https://enfance-jeunesse.fr/"},
  {k:"parentalite", title:"EPE49 — École des parents et des éducateurs", desc:"Lieu ressource pour les parents et les professionnels — soutien à la parentalité à vocation départementale, prévention et co-éducation.", url:"https://ecole-des-parents-et-des-educateurs-49.org/epe-maine-et-loire-page-professionnels"},
];

// Build cards
const grid = document.getElementById('grid');
DATA.forEach((d, i) => {
  const color = COLOR_VARS[d.k];
  const label = SECTION_LABELS[d.k];
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.k = d.k;
  card.dataset.text = (d.title + ' ' + d.desc + ' ' + label).toLowerCase();
  card.style.setProperty('--c', color);

  const linkHtml = d.url
    ? `<a class="card-link" href="${d.url}" target="_blank" rel="noopener">
         <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
         Voir la ressource
       </a>` : '';

  card.innerHTML = `
    <div class="card-accent"></div>
    <div class="card-body">
      <div class="card-section">${label}</div>
      <div class="card-title">${d.title}</div>
      <div class="card-desc">${d.desc}</div>
      <button class="card-toggle" aria-label="Lire la suite">Lire la suite ↓</button>
      ${linkHtml}
    </div>`;

  // Toggle expand
  const descEl = card.querySelector('.card-desc');
  const toggleBtn = card.querySelector('.card-toggle');
  toggleBtn.addEventListener('click', () => {
    card.classList.toggle('expanded');
    toggleBtn.textContent = card.classList.contains('expanded') ? 'Réduire ↑' : 'Lire la suite ↓';
  });

  // Hide toggle if text is short
  requestAnimationFrame(() => {
    if (descEl.scrollHeight <= descEl.clientHeight + 2) toggleBtn.style.display = 'none';
  });

  grid.appendChild(card);
});

// Filter & search
const cards = Array.from(grid.querySelectorAll('.card'));
const noResults = document.getElementById('no-results');

function applyFilters() {
  const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
  const q = document.getElementById('search').value.trim().toLowerCase();

  let visible = 0;
  cards.forEach(c => {
    const matchFilter = activeFilter === 'all' || c.dataset.k === activeFilter;
    const matchSearch = !q || c.dataset.text.includes(q);
    const show = matchFilter && matchSearch;
    c.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  noResults.style.display = visible === 0 ? 'block' : 'none';
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  });
});
document.getElementById('search').addEventListener('input', applyFilters);
</script>
</body>
</html>
